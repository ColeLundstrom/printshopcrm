# PrintShopCRM — nginx reverse proxy
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/printshopcrm
#   # replace shop.example.com with your domain, and 3870 with your PORT
#   sudo ln -s /etc/nginx/sites-available/printshopcrm /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d shop.example.com
#
# certbot rewrites this file to add the TLS listener, the certificate paths, and an HTTP→HTTPS
# redirect. Start with plain HTTP as written here and let it do that.

server {
    listen 80;
    listen [::]:80;
    server_name shop.example.com;

    # Artwork uploads. Raise if your shop sends large production files; keep it in step with any
    # upload limit you set in the app.
    client_max_body_size 64M;

    # Don't advertise the nginx version on error pages.
    server_tokens off;

    # Clickjacking / MIME-sniffing. The app sets its own CSP; these are the cheap wins.
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    access_log /var/log/nginx/printshopcrm.access.log;
    error_log  /var/log/nginx/printshopcrm.error.log;

    location / {
        proxy_pass http://127.0.0.1:3870;
        proxy_http_version 1.1;

        # WebSocket upgrade — the production board pushes live updates over /ws.
        # Without these two lines the app still works but the board stops updating by itself.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived WebSocket connections must not be reaped as idle HTTP requests.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_buffering off;
    }
}

# `Connection: upgrade` only when the client actually asked to upgrade — a bare
# `proxy_set_header Connection "upgrade"` breaks keep-alive for ordinary requests.
#
# This map must live in the http{} context, NOT inside server{}. Put it in
# /etc/nginx/conf.d/upgrade-map.conf (nginx includes that directory by default):
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
