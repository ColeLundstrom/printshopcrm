# Required by deploy/nginx.conf — defines $connection_upgrade.
#
#   sudo cp deploy/upgrade-map.conf /etc/nginx/conf.d/
#
# This has to live in the http{} context, which /etc/nginx/conf.d/*.conf is included into.
# Without it, nginx refuses to start with:
#   unknown "connection_upgrade" variable
#
# Sending a literal `Connection: upgrade` on every request instead would break keep-alive for
# ordinary traffic, so the value is mapped from whether the client actually asked to upgrade.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
