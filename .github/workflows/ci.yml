name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor (node:sqlite). Also run the current release so we see breakage early.
        node: ['22.x', 'lts/*']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: node bin/gate.mjs

      - name: End-to-end tests
        run: node bin/gate-e2e.mjs

      - name: Seed a fresh database
        run: npm run seed

      - name: Server boots and serves
        run: |
          PORT=3999 node --no-warnings server.mjs &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3999/ && break; sleep 1; done
          curl -sf -o /dev/null -w 'GET / → %{http_code}\n' http://localhost:3999/
          curl -sf -o /dev/null -w 'GET /api/dashboard → %{http_code}\n' http://localhost:3999/api/dashboard

  # macOS is the platform most shop owners evaluate the app on before they put it on a server, and
  # README.md and INSTALL.md both said all three OSes were "covered by CI" while this job did not
  # exist. Same suites as Linux and Windows — they are pure Node, so there is nothing to install.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: node bin/gate.mjs

      - name: End-to-end tests
        run: node bin/gate-e2e.mjs

  # Windows is a supported platform for running the app, so it gets tested like one. The e2e suite
  # is pure Node specifically so it can run here — it used to be bash + curl + python3.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: node bin/gate.mjs

      - name: End-to-end tests
        run: node bin/gate-e2e.mjs

      - name: Seed, reset, reseed
        run: |
          npm run seed
          npm run reset

      - name: Server boots and serves
        shell: pwsh
        run: |
          $env:PORT = '3999'
          $p = Start-Process node -ArgumentList '--no-warnings','server.mjs' -PassThru -NoNewWindow
          foreach ($i in 1..30) {
            try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:3999/health | Out-Null; break } catch { Start-Sleep 1 }
          }
          $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:3999/
          "GET / -> $($r.StatusCode)"
          $d = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:3999/api/dashboard
          "GET /api/dashboard -> $($d.StatusCode)"
          Stop-Process -Id $p.Id -Force
          if ($r.StatusCode -ne 200 -or $d.StatusCode -ne 200) { exit 1 }

  # The Dockerfile is a supported install path, so build it and prove the container actually serves.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t printshopcrm:ci .

      - name: Run container and check health
        run: |
          docker run -d --name psc -p 3333:3333 \
            -e PSC_SECRET=ci-test-secret \
            -v psc-data:/data \
            printshopcrm:ci

          for i in $(seq 1 45); do
            if curl -sf -o /dev/null http://localhost:3333/health; then break; fi
            sleep 2
          done

          echo "--- health ---"
          curl -sf -w '\nGET /health → %{http_code}\n' http://localhost:3333/health
          echo "--- app shell ---"
          curl -sf -o /dev/null -w 'GET / → %{http_code}\n' http://localhost:3333/
          echo "--- api ---"
          curl -sf -o /dev/null -w 'GET /api/dashboard → %{http_code}\n' http://localhost:3333/api/dashboard

      - name: Container runs as non-root
        run: |
          U=$(docker exec psc id -un)
          echo "container user: $U"
          [ "$U" = "node" ] || { echo "::error::container is running as $U, expected node"; exit 1; }

      - name: Database landed on the volume, not the image
        run: |
          docker exec psc ls -la /data
          docker exec psc sh -c 'test -f /data/printshop.db' \
            || { echo "::error::no database at /data — PSC_DB is not pointing at the volume"; exit 1; }

      # Uploads are the half this job used to miss. Fly and Render ignore a Dockerfile VOLUME and
      # persist only what their own config mounts — one disk, at /data — so while uploads were a
      # separate VOLUME every deploy silently destroyed every art proof and shop logo, and the app
      # came back up looking healthy with a broken image on every proof and every PDF.
      - name: Customer artwork is on the persistent disk, not the container filesystem
        run: |
          docker exec psc sh -c 'test -L /app/public/uploads' \
            || { echo "::error::/app/public/uploads is not a symlink — artwork is on the container filesystem and dies on every deploy"; exit 1; }
          docker exec psc sh -c 'test -d /data/uploads' \
            || { echo "::error::/data/uploads does not exist — the uploads symlink points nowhere"; exit 1; }
          docker exec psc sh -c 'echo proof-bytes > /app/public/uploads/ci-proof.png'
          docker exec psc sh -c 'test -f /data/uploads/ci-proof.png' \
            || { echo "::error::a file written to public/uploads did not land on the volume"; exit 1; }
          echo "uploads resolve onto the persistent volume"

      - name: Data survives a container replacement
        run: |
          docker rm -f psc
          docker run -d --name psc2 -p 3334:3333 \
            -e PSC_SECRET=ci-test-secret -v psc-data:/data printshopcrm:ci
          for i in $(seq 1 45); do
            if curl -sf -o /dev/null http://localhost:3334/health; then break; fi
            sleep 2
          done
          docker exec psc2 sh -c 'test -f /data/printshop.db' \
            || { echo "::error::database did not survive the container being replaced"; exit 1; }
          # The artwork written by the previous container must still be here and still reachable
          # through the app's own path. A shop's proofs matter as much as its rows.
          docker exec psc2 sh -c 'test -f /data/uploads/ci-proof.png' \
            || { echo "::error::customer artwork did not survive the container being replaced"; exit 1; }
          docker exec psc2 sh -c 'test -f /app/public/uploads/ci-proof.png' \
            || { echo "::error::artwork survived on the volume but is not reachable at public/uploads"; exit 1; }
          echo "database and customer artwork both survived container replacement"

      - name: docker compose brings the stack up
        run: |
          docker rm -f psc2 || true
          # The documented first run, exactly as DEPLOY.md describes it.
          cp .env.example .env
          echo "PSC_SECRET=$(openssl rand -hex 32)" >> .env
          docker compose up -d --build
          for i in $(seq 1 45); do
            if curl -sf -o /dev/null http://localhost:3333/health; then break; fi
            sleep 2
          done
          curl -sf -o /dev/null -w 'compose: GET / → %{http_code}\n' http://localhost:3333/
          docker compose down

      - name: compose refuses to start without PSC_SECRET
        run: |
          # A missing secret must fail loudly, not silently run on a default that lets anyone
          # forge customer share links.
          rm -f .env && touch .env
          if docker compose config >/dev/null 2>&1; then
            echo "::error::compose accepted a missing PSC_SECRET"; exit 1
          fi
          echo "compose correctly refused to start without PSC_SECRET"

      - name: Logs on failure
        if: failure()
        run: |
          docker logs psc 2>&1 | tail -50 || true
          docker compose logs 2>&1 | tail -50 || true

  # The published image is what DEPLOY.md tells people to pull, so prove that exact artifact runs.
  # The job above builds from source; this one pulls what is actually on the registry.
  published-image:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Pull and run the published image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/printshopcrm:latest
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "pulling $IMAGE"
          docker pull "$IMAGE"

          docker run -d --name pub -p 3335:3333 \
            -e PSC_SECRET=ci-published-test \
            -v pub-data:/data "$IMAGE"

          for i in $(seq 1 45); do
            if curl -sf -o /dev/null http://localhost:3335/health; then break; fi
            sleep 2
          done
          curl -sf -o /dev/null -w 'published image: GET / → %{http_code}\n' http://localhost:3335/
          curl -sf -o /dev/null -w 'published image: GET /api/dashboard → %{http_code}\n' http://localhost:3335/api/dashboard
          echo "published image arch: $(docker image inspect "$IMAGE" --format '{{.Os}}/{{.Architecture}}')"
          docker rm -f pub

  # Deploy configs can't be exercised without accounts on those platforms, so at minimum prove they
  # parse and that the settings which silently destroy data are present. Every one of these
  # assertions is a failure mode where the app appears to work and the shop's database is gone.
  deploy-configs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: fly.toml
        run: |
          python3 - <<'PY'
          import tomllib
          d = tomllib.load(open('deploy/fly.toml','rb'))
          assert d['build']['dockerfile'] == 'Dockerfile', \
              "build.dockerfile must be 'Dockerfile' — the docs copy this file to the repo root"
          assert any(m['destination'] == '/data' for m in d['mounts']), \
              "no /data mount — Fly machines are ephemeral, the database would be wiped every deploy"
          assert d['env']['PSC_DB'].startswith('/data/'), "PSC_DB must live on the mounted volume"
          assert d['http_service']['min_machines_running'] >= 1, \
              "min_machines_running 0 lets Fly stop the only machine, killing the automation tick"
          assert d['http_service']['checks'][0]['path'] == '/health'
          print('fly.toml ok')
          PY

      - name: render.yaml
        run: |
          pip install --quiet pyyaml
          python3 - <<'PY'
          import yaml
          s = yaml.safe_load(open('deploy/render.yaml'))['services'][0]
          env = {e['key']: e for e in s['envVars']}
          assert s['plan'] != 'free', "the free plan has no persistent disk — data destroyed on every deploy"
          assert s['disk']['mountPath'] == '/data', "no disk at /data"
          assert env['PSC_DB']['value'].startswith('/data/'), "PSC_DB must live on the disk"
          assert env['PSC_SECRET'].get('generateValue') is True, "PSC_SECRET must be generated, never blank"
          assert s['healthCheckPath'] == '/health'
          print('render.yaml ok')
          PY

      - name: shell scripts parse
        run: |
          for f in deploy/*.sh; do bash -n "$f" && echo "  ok $f"; done

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: No committed credentials
        run: |
          # Fails the build if a real-looking key lands in the tree. Placeholders (psc_live_XXXX,
          # whsec_test) are excluded on purpose — the docs and tests need them.
          if grep -rInE '(sk_live_[A-Za-z0-9]{10,}|sk_test_[A-Za-z0-9]{10,}|whsec_[A-Za-z0-9]{16,}|AIza[A-Za-z0-9_-]{30,}|xox[baprs]-[A-Za-z0-9-]{10,}|gh[pousr]_[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' \
               --exclude-dir=node_modules --exclude-dir=.git . ; then
            echo "::error::A credential-shaped string is committed. Remove it and rotate the key."
            exit 1
          fi
          echo "No credentials found."

      - name: No committed database or .env
        run: |
          if git ls-files | grep -InE '(^|/)\.env$|\.db$|\.sqlite3?$'; then
            echo "::error::A database or .env file is tracked. Add it to .gitignore and git rm --cached it."
            exit 1
          fi
          echo "Clean."
