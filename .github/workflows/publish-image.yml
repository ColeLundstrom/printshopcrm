# Publish the container image to GitHub Container Registry, so self-hosters can pull instead of
# build:
#
#   docker run -p 3333:3333 -e PSC_SECRET=... -v psc:/data ghcr.io/colelundstrom/printshopcrm:latest
#
# `latest` tracks validated release tags. Images are multi-arch so they
# run on a cheap ARM VPS (Ampere, Graviton, Pi) as well as x86.

name: Publish image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require a versioned release from main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$RELEASE_REF" in
            refs/tags/v*) ;;
            *) echo "::error::Publish a version tag, never an unreviewed branch"; exit 1 ;;
          esac
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          test "$RELEASE_REF" = "refs/tags/v$VERSION" || { echo "::error::Tag and package version differ"; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::Release must belong to main"; exit 1; }

      # ARM builds run under emulation. This is pure JavaScript with no native modules, so it is
      # slow to build but has nothing that can fail to cross-compile.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
