<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__BRAND_NAME__</title>
  <link rel="stylesheet" href="/css/app.css?v=__ASSET_V__">
  <link rel="stylesheet" href="/css/icons.css?v=__ASSET_V__">
  <link rel="icon" href="__FAVICON__">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0b0d10">
  <link rel="apple-touch-icon" href="/icon.svg">
  <script>
    // Floor-mode PWA: installable, and the board/scan pages survive shop-wifi dropouts.
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {})
  </script>
  <style id="edition-skin">__EDITION_CSS__</style>
  <script>
    // The server stamps the running edition ('pro' | 'lite') and product brand into the shell.
    window.__EDITION = "__EDITION__";
    // Apply the theme before first paint so there's no flash. The lite edition is light-first by
    // design (a clean, approachable invoicing tool); pro respects the user's saved/OS preference.
    (function () {
      var forced = "__THEME_FORCE__";
      var t = forced || localStorage.getItem('psc-theme');
      if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <!-- ------------------------------------------------------------------------------------------
       Icon sprite. Hand-authored, Lucide-style: 16x16 grid, no fill, 1.5px round-capped strokes,
       stroke="currentColor" so every icon picks up the active / hover / theme colour of whatever
       link it sits in, with no per-icon CSS. Self-contained — no icon font, no CDN, no npm.
       Referenced as <svg class="ico"><use href="#i-NAME"></use></svg>; see public/js/app.js.
  ------------------------------------------------------------------------------------------- -->

        <circle cx="8" cy="10.25" r="1.1"/>

  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <h1><span class="dot"></span> <span id="brand-name">__BRAND_NAME__</span></h1>
        <div class="sub" id="brand-tag">__BRAND_TAG__</div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="shopcard">
        <div class="av" id="shop-initials">RI</div>
        <div style="flex:1;min-width:0">
          <div class="nm" id="shop-name">Rebel Ink Press</div>
          <div class="rl">Owner · unlimited seats</div>
        </div>
        <button class="logout-btn" id="logout-btn" title="Sign out" aria-label="Sign out" hidden><svg class="ico" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><use href="#i-logout"></use></svg></button>

      __SOURCE_LINK__

    <div class="main">
      <a class="trialbar" id="trialbar" href="#/billing" hidden></a>
      <header class="topbar">
        <div class="menu-btn" id="menu-btn" title="Menu"><svg class="ico" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><use href="#i-menu"></use></svg></div>
